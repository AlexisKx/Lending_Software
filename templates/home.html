{% extends "base.html" %}

{% block title %}Dashboard · LoanDesk{% endblock %}

{% block content %}
<div class="min-h-screen">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-6 py-3 flex items-center justify-between">
      <h1 class="text-lg font-semibold text-slate-900">LoanDesk</h1>
      <div class="flex items-center gap-4">
        <span class="text-sm text-slate-600">{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="text-sm text-slate-500 hover:text-slate-900">Sign out</button>
        </form>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-12">
    <div class="bg-white border border-slate-200 rounded-xl p-10 text-center">
      <h2 class="text-xl font-semibold text-slate-900">You're signed in</h2>
      <p class="text-sm text-slate-500 mt-2">The dashboard will live here. We'll build it after the Record Loan screen.</p>
    </div>
  </main>
</div>
{% endblock %}
